name: IndexNow ping
# After each successful deploy, announce every sitemap URL to IndexNow (Bing, Yandex, Seznam, Naver…).
# Key file served at https://www.estatelys.com/<key>.txt (build.mjs, SEO_INDEXNOW_KEY). SEO chat, 6 Nov 2026.
on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
jobs:
  ping:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs
        run: |
          set -e
          HOST=www.estatelys.com
          KEY=1e40a2d42ad17b32a0814fa174ea9ca9
          sleep 180  # let GitHub Pages and its CDN serve the new build everywhere
          curl -fsS "https://$HOST/$KEY.txt" | grep -q "$KEY"
          URLS=$(curl -fsS "https://$HOST/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<\/\?loc>//g' | jq -R . | jq -s .)
          echo "Submitting $(echo "$URLS" | jq length) URLs"
          jq -n --arg host "$HOST" --arg key "$KEY" --argjson urls "$URLS" \
            '{host:$host, key:$key, keyLocation:("https://"+$host+"/"+$key+".txt"), urlList:$urls}' > body.json
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json)
          echo "IndexNow HTTP $code"; cat resp.txt || true
          case "$code" in 200|202) ;; *) echo "::warning::IndexNow answered HTTP $code (Bing will still crawl via the sitemap)";; esac
